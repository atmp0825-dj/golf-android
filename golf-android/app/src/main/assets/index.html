<!DOCTYPE html>
<html lang="ko">
<head>

<title>골프정산</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#091810;--s1:rgba(255,255,255,.06);--s2:rgba(255,255,255,.09);--bd:rgba(201,162,42,.22);--bdl:rgba(255,255,255,.09);--gold:#c9a22a;--goldl:#e4b93e;--tx:#e8e0d0;--mut:#7a9a85;--grn:#4ade80;--red:#f87171;--r:12px}
html,body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;min-height:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background-image:radial-gradient(ellipse at top left,#0d2a18 0%,#091810 65%)}
#app{max-width:480px;margin:0 auto;padding:16px 13px 48px}
.logo{text-align:center;padding:16px 0 10px}
.logo h1{font-size:1.45rem;font-weight:700;color:var(--gold);letter-spacing:.04em}

.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:15px;margin-bottom:11px}
.card-hd{font-size:.72rem;font-weight:700;color:var(--gold);margin-bottom:11px;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.07em}

.sw{position:relative;width:40px;height:22px;display:inline-block;flex-shrink:0;cursor:pointer}

.tbl-wrap{overflow-x:auto}

th{background:rgba(201,162,42,.1);color:var(--gold);padding:6px 3px;text-align:center;font-weight:700;font-size:.66rem;text-transform:uppercase;white-space:nowrap}

.psel{padding:3px 4px;background:var(--s2);border:1px solid var(--bdl);border-radius:5px;color:var(--tx);font-size:.73rem;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;width:35px}
.psel:focus{border-color:var(--gold)}
.badge{display:inline-block;padding:2px 5px;border-radius:3px;font-size:.61rem;font-weight:700}
.b-bae{background:rgba(201,162,42,.18);color:var(--gold)}.b-bb{background:rgba(239,68,68,.14);color:#f87171}
.b-min{background:rgba(255,255,255,.07);color:var(--mut)}.b-skip{background:rgba(255,255,255,.04);color:rgba(122,154,133,.4)}
.mono{font-family:'JetBrains Mono',monospace;font-weight:600}
.pos{color:var(--grn)}.neg{color:var(--red)}.zero{color:var(--mut)}
.up-zone{border:2px dashed rgba(201,162,42,.3);border-radius:11px;padding:22px 14px;text-align:center;cursor:pointer}

.spin{width:22px;height:22px;border:2px solid rgba(201,162,42,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 7px}

.err{color:#f87171;font-size:.72rem;background:rgba(239,68,68,.08);padding:7px 11px;border-radius:7px;margin-top:7px;border:1px solid rgba(239,68,68,.2);white-space:pre-line}
.ok{color:var(--grn);font-size:.72rem;background:rgba(74,222,128,.08);padding:7px 11px;border-radius:7px;margin-top:7px;border:1px solid rgba(74,222,128,.2)}
.warn{color:#fbbf24;font-size:.71rem;background:rgba(251,191,36,.08);padding:7px 11px;border-radius:7px;margin-top:7px;border:1px solid rgba(251,191,36,.2)}
.res-item{background:var(--s1);border:1px solid var(--bdl);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.res-item:last-child{margin-bottom:0}
.res-item.top{border-color:var(--gold);background:rgba(201,162,42,.07)}
.ri-name{font-weight:700;font-size:.88rem}.ri-rank{font-size:.66rem;color:var(--mut);margin-top:1px}
.ri-amt{font-family:'JetBrains Mono',monospace;font-size:1.18rem;font-weight:600}
.par-chip{display:inline-block;width:17px;height:17px;border-radius:3px;font-size:.63rem;font-weight:700;line-height:17px;text-align:center}
.p3c{background:rgba(250,204,21,.13);color:#c9a22a}.p4c{background:rgba(96,165,250,.13);color:#7dd3fc}.p5c{background:rgba(74,222,128,.13);color:#86efac}
.carry-up{color:var(--gold);font-size:.55rem;vertical-align:super;margin-left:1px;font-weight:700}
.trg{font-size:.57rem;color:rgba(122,154,133,.8);margin-top:1px}
.sc-sm{font-size:.59rem;margin-top:1px;color:var(--mut)}.sc-sm.bird{color:var(--gold)}
.info-box{font-size:.68rem;color:var(--mut);padding:8px 10px;background:rgba(201,162,42,.06);border-radius:7px;line-height:1.78;margin-top:4px;border:1px solid rgba(201,162,42,.13)}
.divider{height:1px;background:var(--bdl);margin:10px 0}
.hc-row{display:flex;gap:5px;align-items:center;margin-bottom:7px}
.range-seg{display:flex;gap:5px}
.rbtn{flex:1;padding:7px 4px;border-radius:7px;border:1px solid var(--bdl);background:var(--s1);color:var(--mut);font-size:.74rem;font-family:inherit;cursor:pointer;font-weight:500;text-align:center}
.rbtn.sel{background:rgba(201,162,42,.18);border-color:var(--gold);color:var(--gold);font-weight:700}
.hole-count{font-size:.67rem;color:var(--mut);margin-top:8px;display:flex;align-items:center;gap:6px}
.hole-count .cnt{background:rgba(201,162,42,.12);color:var(--gold);padding:2px 7px;border-radius:4px;font-weight:700;font-size:.69rem}
.mini-tbl{width:100%;border-collapse:collapse;font-size:.73rem;margin-top:8px}
.mini-tbl th{background:rgba(255,255,255,.05);color:var(--mut);padding:5px 7px;text-align:left;font-size:.66rem;font-weight:600;text-transform:uppercase}
.mini-tbl td{padding:6px 7px;border-bottom:1px solid var(--bdl)}
.rel-pos{color:#f87171;font-weight:600}.rel-neg{color:var(--grn);font-weight:600}.rel-zero{color:var(--mut)}
.np-btns{display:flex;gap:3px;flex-wrap:wrap}
.np-btn{padding:2px 6px;border-radius:4px;border:1px solid var(--bdl);background:var(--s1);color:var(--mut);font-size:.66rem;cursor:pointer;font-family:inherit}
.np-btn.sel{background:rgba(201,162,42,.15);border-color:var(--gold);color:var(--gold);font-weight:700}
.key-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.key-dot.set{background:var(--grn)}.key-dot.unset{background:rgba(255,255,255,.2)}
.ocr-mode{display:flex;gap:8px;margin-bottom:2px}
.ocr-opt{flex:1;padding:10px 8px;border-radius:9px;border:1px solid var(--bdl);background:var(--s1);cursor:pointer;text-align:center}
.ocr-opt.sel{border-color:var(--gold);background:rgba(201,162,42,.08)}
.ocr-opt .om-icon{font-size:1.3rem;margin-bottom:4px}
.ocr-opt .om-title{font-size:.76rem;font-weight:700;color:var(--tx)}
.ocr-opt .om-desc{font-size:.63rem;color:var(--mut);margin-top:2px;line-height:1.4}
.ocr-opt.sel .om-title{color:var(--gold)}
</style>
</head>
<body>
<div id="app"><div style="padding:30px 20px;text-align:center"><div style="font-size:2rem;margin-bottom:12px">⛳</div><div style="color:#7a9a85">로딩 중...</div></div></div>
<script>
/* ── 전역 오류 핸들러 ── */
window.onerror = function(msg,src,line,col,err) {
  var a = document.getElementById('app');
  if(a) a.innerHTML = '<div style="padding:20px;font-family:monospace;font-size:.8rem;color:#f87171;background:#091810;line-height:1.8"><div style="font-size:1.2rem;margin-bottom:12px">⛳ 오류</div><div>' + msg + '</div><div>Line: ' + line + '</div></div>';
  return true;
};

/* ── localStorage 안전 래퍼 ── */
function safeGet(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
function safeSet(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
function getApiKey(){return safeGet('g-api','');}
function saveApiKey(v){safeSet('g-api',v?v.trim():'');}
function getOcrMode(){return safeGet('g-ocr','tesseract');}
function saveOcrMode(m){safeSet('g-ocr',m);}

/* ── 상태 ── */
var S = {
  step:0,
  rules:{baseUnit:5000,baebae:false,holes:[true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true,true],nearPin:false,birdieBonus:true,hcap:false,handicaps:[]},
  pc:4, names:['','','',''],
  pars:[4,4,4,5,3,4,4,3,5,4,4,3,4,5,3,4,5,4],
  scores:null, nearPins:null,
  loading:false, err:'', okMsg:'', warnMsg:'',
  ocrPct:0, ocrMsg:''
};
function initArrays(){
  S.scores=[];for(var i=0;i<18;i++){var r=[];for(var j=0;j<4;j++)r.push('');S.scores.push(r);}
  S.nearPins=[];for(var i=0;i<18;i++)S.nearPins.push(-1);
}
initArrays();

var STEPS=['규칙','스코어','이름확인','결과'];

/* ── 정산 엔진 ── */
function compute(){
  var rl=S.rules,n=S.pc,ps=S.pars,sc=S.scores,np=S.nearPins;
  var hR=[],tot=[];
  for(var i=0;i<n;i++)tot.push(0);
  var co=false;
  for(var h=0;h<18;h++){
    var par=ps[h];
    if(!rl.holes[h]){hR.push({hole:h+1,skip:true,par:par,net:za(n),sc:na(n)});continue;}
    var raw=[];
    for(var p=0;p<n;p++)raw.push(parseInt(sc[h][p]));
    var bad=false;for(var p=0;p<n;p++)if(isNaN(raw[p]))bad=true;
    if(bad){hR.push({hole:h+1,inc:true,par:par,net:za(n),sc:raw});continue;}
    var freq={};for(var p=0;p<n;p++)freq[raw[p]]=(freq[raw[p]]||0)+1;
    var mg=0;for(var k in freq)if(freq[k]>mg)mg=freq[k];
    var at=(mg===n);
    var bi=[];for(var p=0;p<n;p++)if(raw[p]<=par-1)bi.push(p);
    var trig=false,tr=[];
    if(mg>=3){trig=true;tr.push(at?'전원동타':mg+'명동타');}
    if(par===3){var d=false;for(var p=0;p<n;p++)if(raw[p]>=par+2)d=true;if(d){trig=true;tr.push('파3더블+');}}
    if(par===4||par===5){var t=false;for(var p=0;p<n;p++)if(raw[p]>=par+3)t=true;if(t){trig=true;tr.push('트리플+');}}
    if(bi.length){trig=true;tr.push('버디');}
    var mult=1,tag='민판';
    if(co&&trig&&rl.baebae){mult=4;tag='배배판';}
    else if(co||trig){mult=2;tag='배판';}
    var unit=rl.baseUnit*mult,net=za(n);
    for(var i=0;i<n;i++)for(var j=i+1;j<n;j++){
      var diff=raw[j]-raw[i];
      if(rl.birdieBonus){var ib=(raw[i]<=par-1),jb=(raw[j]<=par-1);if(ib&&!jb)diff++;else if(jb&&!ib)diff--;}
      var a=diff*unit;net[i]+=a;net[j]-=a;
    }
    if(rl.nearPin&&par===3&&np[h]>=0&&np[h]<n){var w=np[h];for(var p=0;p<n;p++)if(p!==w){net[w]+=unit;net[p]-=unit;}}
    for(var p=0;p<n;p++)tot[p]+=net[p];
    co=at;
    hR.push({hole:h+1,par:par,mult:mult,tag:tag,tr:tr,sc:raw,bi:bi,net:net,unit:unit,nc:at});
  }
  if(rl.hcap)for(var k=0;k<rl.handicaps.length;k++){var hc=rl.handicaps[k];if(hc.from<n&&hc.to<n&&hc.str>0){var a=hc.str*rl.baseUnit;tot[hc.from]-=a;tot[hc.to]+=a;}}
  return{hR:hR,tot:tot};
}
function za(n){var a=[];for(var i=0;i<n;i++)a.push(0);return a;}
function na(n){var a=[];for(var i=0;i<n;i++)a.push(null);return a;}

function fmtK(v){if(!v)return'0';var s=v>0?'+':'-',a=Math.abs(v);return s+(a>=1000?(a/1000)+'k':a);}
function fmtW(v){return(v>0?'+':'')+v.toLocaleString()+'원';}
function mc(v){return v>0?'pos':v<0?'neg':'zero';}
function xe(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ns(){return S.names.slice(0,S.pc);}
function pch(p){return '<span class="par-chip p'+p+'c">'+p+'</span>';}
function filled(){var c=0;for(var h=0;h<18;h++){if(!S.rules.holes[h])continue;var bad=false;for(var p=0;p<S.pc;p++)if(isNaN(parseInt(S.scores[h][p])))bad=true;if(!bad)c++;}return c;}
function getRange(){
  var h=S.rules.holes,f=true,b=true,fn=true,bn=true;
  for(var i=0;i<9;i++){if(!h[i])f=false;if(h[i])fn=false;}
  for(var i=9;i<18;i++){if(!h[i])b=false;if(h[i])bn=false;}
  if(f&&b)return'all';if(f&&bn)return'front';if(b&&fn)return'back';return'custom';
}
function setRange(r){
  S.rules.holes=[];for(var i=0;i<18;i++)S.rules.holes.push(false);
  if(r==='all')for(var i=0;i<18;i++)S.rules.holes[i]=true;
  else if(r==='front')for(var i=0;i<9;i++)S.rules.holes[i]=true;
  else if(r==='back')for(var i=9;i<18;i++)S.rules.holes[i]=true;
}

/* ── OCR ── */
var _tw=null;
function loadTS(cb){
  if(window.Tesseract){cb();return;}
  var sc=document.createElement('script');
  sc.src='https://unpkg.com/tesseract.js@4/dist/tesseract.min.js';
  sc.onload=cb;
  sc.onerror=function(){S.err='Tesseract 로딩 실패';S.loading=false;render();};
  document.head.appendChild(sc);
}
function parseOCR(text){
  var lines=text.split('\n'),pv=null,pr=[];
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    var up=line.toUpperCase();
    if(up.match(/^HOLE|^홀|SIGNATURE/))continue;
    var m=line.match(/-?\d+/g);if(!m||m.length<9)continue;
    var nums=m.map(Number);
    if(nums[nums.length-1]>20)nums=nums.slice(0,-1);
    if(up.indexOf('PAR')>=0||up.indexOf('파')>=0){
      var pn=nums.filter(function(x){return x>=3&&x<=5;});
      if(pn.length>=9){pv=pn.slice(0,18);continue;}
    }
    var sorted=nums.slice().sort(function(a,b){return a-b;});
    if(sorted.length&&sorted[sorted.length-1]-sorted[0]===sorted.length-1&&sorted[0]>=1&&sorted[sorted.length-1]<=18)continue;
    var sn=nums.filter(function(x){return x>=-3&&x<=15;});
    if(sn.length<9)continue;
    var nm=(line.match(/^([가-힣]{2,4})/)||[''])[1];
    pr.push({name:nm,nums:sn.slice(0,pv?pv.length:18)});
  }
  if(!pv||!pr.length)return null;
  var rel=false;
  if(pr[0]){var s0=pr[0].nums.slice(0,9),hs=s0.filter(function(x){return x<=1;}).length,al=s0.filter(function(x){return x>=-3&&x<=5;}).length;rel=(hs>0&&al===s0.length);}
  var players=pr.map(function(p){
    var sc=p.nums.slice(0,pv.length),abs=[];
    if(rel)sc.forEach(function(x,i){abs.push(x+(pv[i]||4));});
    else sc.forEach(function(x){if(x>=1&&x<=14)abs.push(x);});
    return{name:p.name,scores:abs};
  });
  return{pars:pv,players:players,rel:rel};
}
function applyOCR(r){
  S.pc=Math.min(Math.max(r.players.length,2),4);
  for(var i=0;i<S.pc;i++)if(r.players[i]&&r.players[i].name)S.names[i]=r.players[i].name;
  initArrays();
  if(r.pars.length<=9)setRange('front');else setRange('all');
  for(var h=0;h<r.pars.length;h++){
    S.pars[h]=r.pars[h];
    for(var p=0;p<S.pc;p++)if(r.players[p]&&r.players[p].scores[h]!==undefined)S.scores[h][p]=String(r.players[p].scores[h]);
  }
}
function runTS(file){
  S.loading=true;S.err='';S.okMsg='';S.warnMsg='';S.ocrPct=0;S.ocrMsg='로딩 중...';render();
  loadTS(function(){
    S.ocrMsg='OCR 준비 중...';S.ocrPct=10;render();
    Tesseract.createWorker(['kor','eng'],1,{logger:function(m){
      if(m.status==='loading tesseract core'){S.ocrMsg='엔진 초기화...';S.ocrPct=25;render();}
      if(m.status==='loading language traineddata'){S.ocrMsg='언어팩 로딩...';S.ocrPct=45;render();}
      if(m.status==='initializing api'){S.ocrMsg='준비 완료...';S.ocrPct=70;render();}
      if(m.status==='recognizing text'){S.ocrMsg='텍스트 인식 중...';S.ocrPct=80+Math.round(m.progress*15);render();}
    }}).then(function(w){
      return w.recognize(file).then(function(res){
        w.terminate();

        if(p.rel)ws.push('파대비타수 감지 → 절대타수로 변환');
        if(p.players.some(function(x){return !x.name;}))ws.push('일부 이름 미인식 — 다음 단계에서 수정');
        S.okMsg='✅ '+p.pars.length+'홀 인식! '+p.players.length+'명';
        if(ws.length)S.warnMsg='⚠️ '+ws.join(' · ');

function runAPI(file){
  var ak=getApiKey();
  if(!ak){S.err='규칙 설정에서 API 키를 먼저 입력하세요.';render();return;}
  S.loading=true;S.err='';S.okMsg='';S.warnMsg='';S.ocrMsg='AI 인식 중...';S.ocrPct=50;render();
  var rd=new FileReader();
  rd.onload=function(){
    var b64=rd.result.split(',')[1],mt=file.type.startsWith('image/')?file.type:'image/jpeg';
    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':ak,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:mt,data:b64}},
        {type:'text',text:'골프 스코어카드 분석. 파대비타수는 절대타수로 변환(절대타수=PAR+파대비). 순수JSON만:\n{"players":["이름1","이름2","이름3","이름4"],"holes":[{"hole":1,"par":4,"scores":[5,4,6,5]},...]}'}
      ]}]})
    }).then(function(r){return r.json();}).then(function(d){
      if(d.error)throw new Error(d.error.message);
      var txt=d.content.map(function(c){return c.text||'';}).join('');
      var pd=JSON.parse(txt.replace(/```[\w]*\n?|```/g,'').trim());
      var fl=0;
      if(pd.players&&pd.players.length){S.pc=Math.min(Math.max(pd.players.length,2),4);for(var i=0;i<S.pc;i++)if(pd.players[i])S.names[i]=pd.players[i];}
      if(pd.holes&&pd.holes.length){
        initArrays();
        var ns2=pd.holes.map(function(h){return h.hole;});
        var hb=ns2.some(function(x){return x>=10;}),hf=ns2.some(function(x){return x<=9;});
        if(hf&&!hb)setRange('front');else if(!hf&&hb)setRange('back');else setRange('all');
        pd.holes.forEach(function(h){var idx=h.hole-1;if(idx>=0&&idx<18){if(h.par)S.pars[idx]=h.par;if(h.scores){for(var p=0;p<S.pc;p++)if(h.scores[p]>0)S.scores[idx][p]=String(h.scores[p]);fl++;}}});
      }
      S.okMsg='✅ '+fl+'홀 인식! '+S.pc+'명';
      S.loading=false;S.ocrPct=100;render();
    }).catch(function(e){S.err='인식 실패: '+(e.message||'오류');S.loading=false;render();});
  };
  rd.readAsDataURL(file);
}

  document.getElementById('app').innerHTML='<div class="logo"><h1>⛳ 골프정산</h1><p>Golf Settler</p></div>'+sb+bd;
}

/* ── 핸들러 ── */
window.gs=function(s){S.step=s;render();};
window.sr=function(k,v){S.rules[k]=v;render();};
window.tr=function(k){S.rules[k]=!S.rules[k];render();};
window.th=function(h){S.rules.holes[h]=!S.rules.holes[h];render();};
window.spc=function(n){S.pc=n;render();};
window.sn=function(i,v){S.names[i]=v;};
window.ssc=function(h,pi,v){S.scores[h][pi]=v;};
window.sp=function(h,v){S.pars[h]=parseInt(v);render();};
window.snp=function(h,v){S.nearPins[h]=v;render();};
window.ah=function(){S.rules.handicaps.push({from:0,to:1,str:1});render();};
window.rh=function(i){S.rules.handicaps.splice(i,1);render();};
window.uh=function(i,k,v){S.rules.handicaps[i][k]=(k==='str'?parseInt(v)||0:parseInt(v));render();};
window.srng=function(r){setRange(r);render();};
window.setMode=function(m){saveOcrMode(m);render();};
window.svk=function(){var el=document.getElementById('akin');saveApiKey(el?el.value:'');render();};
window.clk=function(){saveApiKey('');render();};
window.ng=function(){initArrays();S.okMsg='';S.warnMsg='';S.step=0;render();};
window.handleUpload=handleUpload;

render();
</script>
</body>
