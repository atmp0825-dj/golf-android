// ── Tesseract OCR ──────────────────────────────────────────────────
let _tWorker=null;

async function loadTesseract(){
  if(!window.Tesseract){
    S.ocrStatus='OCR 엔진 다운로드 중... (최초 1회, 약 30초)';S.ocrProgress=5;render();
    await new Promise((res,rej)=>{
      const sc=document.createElement('script');
      sc.src='https://unpkg.com/tesseract.js@4/dist/tesseract.min.js';
      sc.onload=res;sc.onerror=rej;
      document.head.appendChild(sc);
    });
  }
  if(!_tWorker){
    S.ocrStatus='OCR 언어팩 로딩 중...';S.ocrProgress=20;render();
    _tWorker=await Tesseract.createWorker(['kor','eng'],1,{
      logger:m=>{
        if(m.status==='loading tesseract core'){S.ocrStatus='OCR 엔진 초기화 중...';S.ocrProgress=30;}
        if(m.status==='loading language traineddata'){S.ocrStatus='한국어 언어팩 로딩 중...';S.ocrProgress=50;}
        if(m.status==='initializing api'){S.ocrStatus='OCR 준비 중...';S.ocrProgress=70;}
        if(m.status==='recognizing text'){S.ocrStatus='텍스트 인식 중...';S.ocrProgress=80+Math.round(m.progress*15);}
        render();
      }
    });
  }
  return _tWorker;
}

function parseOCRText(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  let parValues=null,playerRows=[];

  for(const line of lines){
    const upper=line.toUpperCase();
    // Skip header rows
    if(upper.match(/^HOLE|^홀|SIGNATURE|시그니처/))continue;
    // Extract all numbers (including negative)
    const allNums=(line.match(/-?\d+/g)||[]).map(Number);
    if(allNums.length<9)continue;

    // Skip total column: remove last number if it's a sum (>20)
    const nums=allNums[allNums.length-1]>20?allNums.slice(0,-1):allNums;

    // PAR row detection
    if(upper.includes('PAR')||upper.includes('파')||
       (nums.length>=9&&nums.every(n=>n>=3&&n<=5))){
      const pNums=nums.filter(n=>n>=3&&n<=5);
      if(pNums.length>=9){parValues=pNums.slice(0,18);continue;}
    }

    // Skip hole number sequences (1-9 or 10-18)
    const sorted=[...nums].sort((a,b)=>a-b);
    const isSeq=(sorted[0]===1&&sorted[sorted.length-1]<=18)||(sorted[0]>=1&&sorted[sorted.length-1]-sorted[0]===sorted.length-1);
    if(isSeq&&sorted[0]>=1&&sorted[sorted.length-1]<=18)continue;

    // Player score row
    const scoreNums=nums.filter(n=>n>=-3&&n<=15);
    if(scoreNums.length<9)continue;

    // Extract Korean/English name at start of line
    const nameMatch=line.match(/^([가-힣]{2,4}|[a-zA-Z]{2,}(?:\s[a-zA-Z]+)?)/);
    const name=nameMatch?nameMatch[1].trim():'';

    playerRows.push({name,nums:scoreNums.slice(0,parValues?parValues.length:18)});
  }

  if(!parValues||playerRows.length===0)return null;

  // Detect relative vs absolute scores
  const players=playerRows.map(pr=>{
    const sc=pr.nums.slice(0,parValues.length);
    // Relative: most values are -2 to +4, and there are some 0s or negatives
    const isRelative=sc.filter(n=>n>=-3&&n<=5).length===sc.length&&sc.some(n=>n<=1);
    let absScores;
    if(isRelative){
      absScores=sc.map((s,i)=>s+(parValues[i]||4));
    }else{
      absScores=sc.filter(n=>n>=1&&n<=14);
    }
    return{name:pr.name,scores:absScores};
  });

  return{pars:parValues,players,isRelative:players.length>0&&playerRows[0].nums.some(n=>n<=1&&n>=-2)};
}

async function runTesseract(file){
  S.loading=true;S.err='';S.okMsg='';S.warnMsg='';S.ocrProgress=0;render();
  try{
    const worker=await loadTesseract();
    S.ocrStatus='이미지 분석 중...';S.ocrProgress=80;render();
    const{data:{text}}=await worker.recognize(file);
    S.ocrProgress=98;S.ocrStatus='결과 처리 중...';render();
    const result=parseOCRText(text);
    if(!result||result.players.length===0){
      S.err='스코어카드를 인식하지 못했어요.\n사진이 선명한지 확인하거나 직접 입력해주세요.';
      S.loading=false;render();return;
    }
    applyOCRResult(result);
    const warnings=[];
    if(result.isRelative)warnings.push('파대비타수 감지 → 절대타수로 변환했어요');
    if(result.players.some(p=>!p.name))warnings.push('일부 이름이 인식되지 않았어요. 다음 단계에서 수정하세요');
    S.okMsg=`✅ ${result.pars.length}홀 인식 완료! 플레이어 ${result.players.length}명`;
    if(warnings.length)S.warnMsg='⚠️ '+warnings.join(' · ');
  }catch(e){
    S.err='OCR 실패: '+(e.message||'다시 시도해주세요');
  }
  S.loading=false;S.ocrProgress=100;render();
}

  if(!apiKey){S.err='⚠️ 규칙 설정에서 API 키를 먼저 입력하세요.';render();return;}

    const mt=file.type.startsWith('image/')?file.type:'image/jpeg';
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:mt,data:b64}},
        {type:'text',text:`이 골프 스코어카드를 분석하여 JSON으로 반환하세요.

파대비타수(0,1,-1 형태)인 경우 절대타수로 변환: 절대타수=PAR+파대비타수

순수 JSON만 반환:
{"players":["이름1","이름2","이름3","이름4"],"holes":[{"hole":1,"par":4,"scores":[5,4,6,5]},...]}

scores는 반드시 절대타수. 9홀이면 9개, 18홀이면 18개.`}
      ]}]})
    });
    const d=await resp.json();
    if(d.error)throw new Error(d.error.message);
    const txt=d.content.map(c=>c.text||'').join('');
    const parsed=JSON.parse(txt.replace(/```[\w]*\n?|```/g,'').trim());
    let filled=0;
    if(parsed.players?.length){S.pc=Math.min(Math.max(parsed.players.length,2),4);parsed.players.slice(0,S.pc).forEach((n,i)=>{if(n)S.names[i]=n;});}
    if(parsed.holes?.length){
      S.scores=Array(18).fill(null).map(()=>Array(4).fill(''));
      const nums=parsed.holes.map(h=>h.hole);
      const hB=nums.some(n=>n>=10),hF=nums.some(n=>n<=9);
      if(hF&&!hB)setRange('front');else if(!hF&&hB)setRange('back');else setRange('all');
      parsed.holes.forEach(({hole,par,scores:hs})=>{const idx=hole-1;if(idx>=0&&idx<18){if(par)S.pars[idx]=par;if(hs){hs.slice(0,S.pc).forEach((s,pi)=>{S.scores[idx][pi]=s>0?String(s):'';});filled++;}}});
    }
    S.okMsg=`✅ ${filled}홀 인식 완료! 플레이어 ${S.pc}명`;
  }catch(e){S.err='인식 실패: '+(e.message||'다시 시도해주세요');}
  S.loading=false;S.ocrProgress=100;render();
}

function applyOCRResult(result){
  const{pars,players}=result;
  S.pc=Math.min(Math.max(players.length,2),4);
  players.slice(0,S.pc).forEach((p,i)=>{if(p.name)S.names[i]=p.name;});
  S.scores=Array(18).fill(null).map(()=>Array(4).fill(''));
  const holeCount=pars.length;
  if(holeCount<=9){
    // Detect if front or back
    setRange('front');// default to front; user can change
  }else{setRange('all');}
  const holesOffset=0;// always start from hole 1 for tesseract
  pars.forEach((par,i)=>{
    S.pars[i]=par;
    players.slice(0,S.pc).forEach((p,pi)=>{
      if(p.scores[i]!==undefined)S.scores[i][pi]=String(p.scores[i]);
    });
  });
}

async function handleUpload(file){
  if(!file)return;
  if(S.ocrMode==='api')await runAnthropicAPI(file);
  else await runTesseract(file);
}

      </table></div>
    </div>
    <div class="foot"><button class="btn" onclick="goStep(1)">← 스코어 수정</button><button class="btn" style="border-color:var(--gold);color:var(--gold)" onclick="newGame()">새 게임 🔄</button></div>`;}

  document.getElementById('app').innerHTML=`<div class="logo"><h1>⛳ 골프정산</h1><p>Golf Settler</p></div>${stepBar}${body}`;
}

// ── 이벤트 핸들러 ─────────────────────────────────────────────────
window.goStep=s=>{S.step=s;render();};
window.setR=(k,v)=>{S.rules[k]=v;render();};
window.toggleR=k=>{S.rules[k]=!S.rules[k];render();};
window.setPc=n=>{S.pc=n;render();};
window.setName=(i,v)=>{S.names[i]=v;};
window.setSc=(h,pi,v)=>{S.scores[h][pi]=v;};
window.setPar=(h,v)=>{S.pars[h]=parseInt(v);render();};
window.setNp=(h,v)=>{S.nearPins[h]=v;render();};
window.addHc=()=>{S.rules.handicaps.push({from:0,to:1,str:1});render();};
window.rmHc=i=>{S.rules.handicaps.splice(i,1);render();};
window.updHc=(i,k,v)=>{S.rules.handicaps[i][k]=k==='str'?(parseInt(v)||0):parseInt(v);render();};
window.toggleHole=h=>{S.rules.holes[h]=!S.rules.holes[h];render();};
window.setRangeBtn=r=>{setRange(r);render()};
window.setOcrMode=m=>{saveOcrMode(m);render();};
window.doSaveKey=()=>{saveApiKey(document.getElementById('apiKeyInp')?.value||'');render();};
window.doClearKey=()=>{saveApiKey('');render();};
window.newGame=()=>{S.scores=Array(18).fill(null).map(()=>Array(4).fill(''));S.nearPins=Array(18).fill(-1);S.okMsg='';S.warnMsg='';S.step=0;render();};
window.handleUpload=handleUpload;

window.addEventListener('online',render);
window.addEventListener('offline',render);
render();
</script>
</body>
</html>
