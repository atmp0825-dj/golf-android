plugins {
    id 'com.android.application'
}

android {
    namespace 'com.golfsettler.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.golfsettler.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 외부 라이브러리 없음 - 순수 WebView 앱
}
